<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" crossorigin="anonymous"/>
    <title>QA Assistant</title>
</head>
<body>

  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <span class="brand-icon">⬡</span>
        <span class="brand-text">QA<em>rag</em></span>
      </div>

      <!-- DOCUMENT SUBMISSION FORM -->
      <div class="doc-submit-section">
        <div class="doc-submit-header">
          <h3>Додати документи</h3>
          <button type="button" class="toggle-form-btn" id="toggle-form-btn" title="Розгорнути/Згорнути">
            <i class="fa fa-chevron-down"></i>
          </button>
        </div>

        <form id="sidebar-doc-form" class="sidebar-doc-form" style="display: none;">
          <!-- Website URL -->
          <div class="sidebar-form-group">
            <label for="sidebar-website">Веб-сайт</label>
            <input type="url" id="sidebar-website" placeholder="https://example.com/" required>
          </div>

          <!-- Documents Container -->
          <div id="sidebar-docs-container">
            <div class="sidebar-doc-entry" data-index="0">
              <div class="entry-title">
                <span>Документ 1</span>
                <button type="button" class="entry-remove-btn" onclick="removeSidebarDocEntry(0)" style="display:none">
                  <i class="fa fa-times"></i>
                </button>
              </div>

              <div class="sidebar-form-group">
                <label for="sidebar-title-0">Назва</label>
                <input type="text" id="sidebar-title-0" placeholder="Homepage overview" required>
              </div>

              <div class="sidebar-form-group">
                <label for="sidebar-content-0">Вміст</label>
                <textarea id="sidebar-content-0" placeholder="Вміст..." rows="2" required></textarea>
              </div>

              <div class="sidebar-form-group">
                <label for="sidebar-source-0">URL</label>
                <input type="url" id="sidebar-source-0" placeholder="https://example.com/" required>
              </div>

              <div class="sidebar-form-group">
                <label for="sidebar-section-0">Розділ</label>
                <input type="text" id="sidebar-section-0" placeholder="homepage">
              </div>
            </div>
          </div>

          <button type="button" class="add-entry-btn" onclick="addSidebarDocEntry()">
            <i class="fa fa-plus"></i> Ще документ
          </button>

          <button type="submit" class="submit-btn-sidebar">
            <i class="fa fa-paper-plane"></i> Надіслати
          </button>
        </form>
      </div>

      <div class="section-label">БАЗА ЗНАНЬ</div>
      <ul class="doc-list" id="doc-list">
        <li class="doc-empty">Документи відсутні</li>
      </ul>
    </div>

    <div class="sidebar-bottom">

  <div class="status-row" id="status-row">
    <span class="status-dot" id="status-dot"></span>
    <span id="status-text">Перевірка...</span>
  </div>

  <div class="auth-section" id="auth-section">
    <div class="auth-title">Авторизація</div>

    <div class="sidebar-form-group">
      <input
        type="text"
        id="username"
        placeholder="Username">
    </div>

    <div class="sidebar-form-group">
      <input
        type="password"
        id="password"
        placeholder="Password">
    </div>

    <button type="button" class="submit-btn-sidebar" id="login-btn">
      <i class="fa fa-sign-in-alt"></i>
      Увійти
    </button>
  </div>

  <div id="login-status" class="login-status"></div>

</div>
  </aside>

  <!-- MAIN -->
  <main id="main">

    <!-- WELCOME SCREEN -->
    <div class="view welcome-view" id="welcome-view">
      <div class="welcome-content">
        <div class="welcome-hex">⬡</div>
        <h1 class="welcome-title">QA Assistant</h1>
        <p class="welcome-sub">Інтелектуальний пошук по документації.<br>Завантажте документи та ставте питання.</p>
        <div class="welcome-chips">
          <button class="chip" onclick="setPrompt('Які критерії прийнятності для цієї функції?')">Критерії прийнятності</button>
          <button class="chip" onclick="setPrompt('Які тест-кейси покривають авторизацію?')">Тест-кейси авторизації</button>
          <button class="chip" onclick="setPrompt('Опиши процес регресійного тестування')">Регресійне тестування</button>
          <button class="chip" onclick="setPrompt('Які вимоги до продуктивності системи?')">Вимоги до продуктивності</button>
        </div>
      </div>
    </div>

    <!-- CHAT VIEW -->
    <div class="view chat-view" id="chat-view" style="display:none">
      <div class="messages" id="messages"></div>
    </div>

    <!-- INPUT FORM -->
    <div id="input-area">
      <div class="input-wrapper">
        <textarea id="message" rows="1" placeholder="Задайте питання по документації..."></textarea>
        <button class="send-btn" id="send-btn" title="Надіслати (Shift+Enter)">
          <i class="fa fa-paper-plane"></i>
        </button>
      </div>
      <div class="input-meta">
        <span class="docs-count" id="docs-count">0 документів у базі</span>
        <span class="disclaimer">Відповіді формуються на основі завантаженої документації</span>
      </div>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
